[project]
name = "remote-term-bot"
version = "0.1.0"
description = "Telegram bot for managing Upterm terminal sessions"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "python-telegram-bot>=22.0,<23.0",
]

[project.scripts]
remote-term-bot = "remote_term_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_term_bot"]
